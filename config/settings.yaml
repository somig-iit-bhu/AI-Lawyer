app:
  name: NyayaSaathi
  environment: development
  default_language: auto
  supported_languages: [en, hi, hinglish]
llm:
  # Configure generation in a later phase. Phase 1 does not make LLM calls.
  provider: gemini
  # Listed as available for the configured Gemini API key on 2026-11-08.
  model: gemini-3.1-flash-lite
  api_base_url: null
  api_key_env: GEMINI_API_KEY
  # Valid providers: gemini, openai_compatible. Set these when enabling Phase 2.
  system_prompt_path: config/prompts/legal_assistant_v1.md
  structured_output: true
  temperature: 0.2
  max_output_tokens: 2048
  timeout_seconds: 45
  max_retries: 2
embeddings:
  provider: sentence_transformers
  # Supply a local/Hugging Face Sentence Transformers model ID before indexing.
  model_id: intfloat/multilingual-e5-small
  cache_folder: null
  device: cpu
  trust_remote_code: false
  # Use the already downloaded model without remote Hugging Face metadata checks.
  local_files_only: true
  normalize: true
  batch_size: 32
  query_prefix: "query: "
  passage_prefix: "passage: "
  # `regex` is deterministic and offline; `huggingface` uses the configured model tokenizer.
  tokenizer: regex
pdf_processing:
  input_directory: Data
  output_directory: data/parsed
  preferred_language: en
  preserve_page_references: true
  remove_repeated_headers: true
  remove_repeated_footers: true
  repeated_line_ratio: 0.6
  min_extraction_quality: 0.75
  enable_ocr: false
chunking:
  strategy: section_aware
  target_tokens: 450
  max_tokens: 650
  overlap_tokens: 60
  preserve_headings: true
vector_store:
  provider: faiss
  index_type: flat_ip
  index_path: data/index/legal.faiss
  metadata_path: data/index/metadata.jsonl
  manifest_path: data/index/manifest.json
retrieval:
  dense_top_k: 8
  final_top_k: 5
  # Blend multilingual semantic similarity with exact legal-term matching.
  hybrid_enabled: true
  dense_weight: 0.75
  lexical_weight: 0.25
  reranker_enabled: false
  min_similarity: null
features:
  consumer_disputes: true
  rental_disputes: false
  voice_input: false
  document_upload: false
  document_export: true
safety:
  require_source_citations: true
  allow_unsupported_legal_claims: false
  require_professional_help_disclaimer: true
